server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      soundcloud: true
      http: true

plugins:
  youtube:
    enabled: true

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_OAUTH_REFRESH_TOKEN}"
      skipInitialization: true

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "Lavalink"

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      # - WEB
      - MWEB
      # - WEBEMBEDDED
      # - TV

  lavasrc:
    sources:
      spotify: true
      ytdlp: true

    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "ES"

    ytdlp:
      path: "yt-dlp"
      customLoadArgs:
        - "-q"
        - "--no-warnings"
        - "--flat-playlist"
        - "--skip-download"
        - "-J"

logging:
  level:
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  file:
    name: /opt/Lavalink/logs/lavalink.log