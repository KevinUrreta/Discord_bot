server:
  port: 2333
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"

  server:
    password: "youshallnotpass"
    sources:
      youtube: false
      soundcloud: true
      http: true

plugins:
  youtube:
    enabled: true

    oauth:
      enabled: true
      skipInitialization: true

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      userAgent: "Lavalink"

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - WEB
      - TV
      - MWEB

logging:
  level:
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO

  file:
    name: /opt/Lavalink/logs/lavalink.log