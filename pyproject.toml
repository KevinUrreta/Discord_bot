[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-bot"
version = "1.0.0"
description = "Bot de música para Discord"
requires-python = ">=3.14"

dependencies = [
    "discord.py==2.7.1",
    "wavelink==3.5.2",
    "yt-dlp==2026.8.19",
    "SQLAlchemy[asyncio]==2.1.0",
    "asyncpg==0.31.0",
    "pydantic-settings",
    "python-dotenv==1.2.3",
    "PyNaCl==1.6.2",
    "davey==0.1.6",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]